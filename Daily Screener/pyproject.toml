[project]
name = "sier-daily-screener"
version = "0.1.0"
description = "SIER 15-minute IDX data pipeline and next-session equity screener"
requires-python = ">=3.11,<3.13"
dependencies = [
  "einops==0.8.1",
  "huggingface-hub==0.33.1",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "kaggle>=2.2,<3",
  "matplotlib>=3.9",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "python-dotenv>=1.1",
  "safetensors==0.6.2",
  "torch==2.7.1",
  "tqdm>=4.66",
  "yfinance>=0.2.65",
]

[tool.uv]
package = false
